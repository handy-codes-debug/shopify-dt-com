<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile collection filters</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1F2125; background: #F2F2F3">
  <!-- collection page behind -->
  <div aria-hidden="true">
    <div style="background: #FFFFFF; height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #DEDEE0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">DealTargets</div>
    <div style="padding: 16px">
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; margin-bottom: 12px">Graphics Cards</div>
      <div style="display: flex; gap: 8px; margin-bottom: 14px">
        <span style="flex: 1; height: 44px; border-radius: 8px; background: #1F2125"></span>
        <span style="flex: 1; height: 44px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9C9CC"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="height: 250px; border-radius: 12px; background: #FFFFFF"></div>
        <div style="height: 250px; border-radius: 12px; background: #FFFFFF"></div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(14,17,22,0.55)"></div>

  <!-- bottom sheet -->
  <section role="dialog" aria-label="Filter and sort" style="position: absolute; left: 0; right: 0; bottom: 0; height: 720px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #C9C9CC; margin: 10px auto 0"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 12px 20px; border-bottom: 1px solid #DEDEE0">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px">Filter &amp; sort</h2>
      <button type="button" aria-label="Close filters" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F2F2F3; color: #1F2125; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
    </div>
    <div style="flex: 1; overflow: hidden; padding: 0 20px">
      <label style="display: flex; flex-direction: column; gap: 6px; padding: 16px 0; border-bottom: 1px solid #DEDEE0; font-weight: 600; font-size: 15px">Sort by
        <select style="height: 46px; border: 1px solid #C9C9CC; border-radius: 8px; padding: 0 12px; font: 400 15px Inter, sans-serif; background: #FFFFFF; color: #1F2125"><option>Featured</option><option>Price, low to high</option><option>Price, high to low</option><option>Newest</option></select>
      </label>
      <fieldset style="border: 0; margin: 0; padding: 16px 0; border-bottom: 1px solid #DEDEE0">
        <legend style="font-weight: 600; font-size: 15px; padding: 0; float: left; width: 100%; margin-bottom: 8px">Availability</legend>
        <label style="clear: both; display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #C2410C">In stock</label>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 16px 0; border-bottom: 1px solid #DEDEE0">
        <legend style="font-weight: 600; font-size: 15px; padding: 0; float: left; width: 100%; margin-bottom: 10px">Video memory</legend>
        <div style="clear: both; display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9C9CC; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #1F2125">8GB</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9C9CC; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #1F2125">12GB</button>
          <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1.5px solid #E8590C; background: #FFF1E8; font: 600 14px Inter, sans-serif; color: #9A3412">16GB</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9C9CC; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #1F2125">24GB+</button>
        </div>
      </fieldset>
      <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid #DEDEE0; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0; font: 600 15px Inter, sans-serif; color: #1F2125">GPU chipset <span style="font-weight: 500; color: #C2410C">RTX 5070 Ti ›</span></button>
      <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid #DEDEE0; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0; font: 600 15px Inter, sans-serif; color: #1F2125">Price <span aria-hidden="true" style="color: #5A5C61">›</span></button>
      <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid #DEDEE0; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0; font: 600 15px Inter, sans-serif; color: #1F2125">Brand <span aria-hidden="true" style="color: #5A5C61">›</span></button>
    </div>
    <div style="display: flex; gap: 10px; padding: 14px 20px 24px; border-top: 1px solid #DEDEE0">
      <button type="button" style="flex: 1; min-height: 52px; border-radius: 10px; border: 1.5px solid #1F2125; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #1F2125">Clear all</button>
      <button type="button" style="flex: 2; min-height: 52px; border-radius: 10px; border: 0; background: #FF6B1A; font: 600 15px Inter, sans-serif; color: #1F2125">Show [N] results</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
