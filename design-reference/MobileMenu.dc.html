<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile menu drawer</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1F2125; background: #F2F2F3">
  <!-- page behind -->
  <div aria-hidden="true">
    <div style="background: #1F2125; color: #FFFFFF; font-size: 12px; text-align: center; padding: 8px 12px">Free shipping over $[THRESHOLD]</div>
    <div style="background: #FFFFFF; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #DEDEE0">
      <span style="width: 24px"></span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">DealTargets</span>
      <span style="width: 24px"></span>
    </div>
    <div style="background: #1F2125; height: 420px"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(14,17,22,0.55)"></div>

  <!-- drawer -->
  <nav aria-label="Main menu" style="position: absolute; top: 0; left: 0; bottom: 0; width: 330px; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 8px 0 32px rgba(0,0,0,0.25)">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-bottom: 1px solid #DEDEE0">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">DealTargets</span>
      <button type="button" aria-label="Close menu" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F2F2F3; color: #1F2125; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
    </div>
    <div style="padding: 14px 16px">
      <label for="m-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
      <input id="m-q" type="search" placeholder="Search products or part #" style="width: 100%; height: 46px; box-sizing: border-box; border: 1.5px solid #C9C9CC; border-radius: 10px; padding: 0 14px; font: 400 15px Inter, sans-serif">
    </div>
    <ul style="margin: 0; padding: 0 8px; list-style: none; flex: 1; overflow: hidden">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <li><a href="Collection.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 12px; border-radius: 8px; color: #1F2125; text-decoration: none; font-size: 16px; font-weight: 500">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8590C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
          <span style="flex: 1">{{c.name}}</span>
          <span aria-hidden="true" style="color: #5A5C61">›</span>
        </a></li>
      </sc-for>
      <li><a href="Campaign.dc.html" style="display: flex; align-items: center; min-height: 50px; padding: 0 12px 0 48px; color: #C2410C; text-decoration: none; font-size: 16px; font-weight: 700">Black Friday deals</a></li>
    </ul>
    <div style="border-top: 1px solid #DEDEE0; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <a href="Main.dc.html" style="min-height: 40px; display: flex; align-items: center; color: #1F2125; text-decoration: none">Sign in / Create account</a>
      <a href="Help.dc.html" style="min-height: 40px; display: flex; align-items: center; color: #1F2125; text-decoration: none">Help &amp; FAQ</a>
      <a href="About.dc.html" style="min-height: 40px; display: flex; align-items: center; color: #1F2125; text-decoration: none">Contact us</a>
    </div>
  </nav>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { name: 'Graphics Cards', d: 'M2 6h20v11H2z M11 11.5a3 3 0 1 1-6 0a3 3 0 1 1 6 0 M19 11.5a3 3 0 1 1-6 0a3 3 0 1 1 6 0 M5 17v3h9v-3' },
        { name: 'Processors', d: 'M6 6h12v12H6z M9 9h6v6H9z M9 2v4 M15 2v4 M9 18v4 M15 18v4 M2 9h4 M2 15h4 M18 9h4 M18 15h4' },
        { name: 'Motherboards', d: 'M3 3h18v18H3z M7 7h5v5H7z M15 7h2 M15 10h2 M7 16h10 M7 19h4 M16 13v1' },
        { name: 'Memory', d: 'M2 8h20v8H2z M5 11h2v2H5z M9 11h2v2H9z M13 11h2v2h-2z M17 11h2v2h-2z M4 16v3 M20 16v3 M12 16v2' },
        { name: 'Storage', d: 'M3 8h18v8H3z M6 11h5v2H6z M14 11h1 M17 11h1 M14 13h1 M17 13h1 M21 10.5v3' },
        { name: 'Power Supplies', d: 'M3 5h18v14H3z M14 12a4 4 0 1 1-8 0a4 4 0 1 1 8 0 M10 9v3 M17 9h1 M17 12h1 M17 15h1' },
        { name: 'Cases', d: 'M7 2h10v20H7z M10 5h4 M10 8h4 M14 17a2 2 0 1 1-4 0a2 2 0 1 1 4 0' },
        { name: 'Cooling', d: 'M3 3h18v18H3z M14 12a2 2 0 1 1-4 0a2 2 0 1 1 4 0 M12 10c0-4 4-5 5-3 M14 12c4 0 5 4 3 5 M12 14c0 4-4 5-5 3 M10 12c-4 0-5-4-3-5' }
      ]
    };
  }
}
</script>
</body>
</html>
