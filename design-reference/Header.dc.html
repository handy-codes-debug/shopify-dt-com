<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Announcement bar and header</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: Inter, system-ui, sans-serif; color: #1F2125; background: #FFFFFF; border-bottom: 1px solid #DEDEE0">
  <!-- Announcement bar -->
  <div style="background: #1F2125; color: #FFFFFF; font-size: 14px">
    <div style="max-width: 1360px; margin: 0 auto; padding: 8px 32px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; min-height: 24px">
      <span style="color: #C4C5C8">All prices in USD</span>
      <p style="margin: 0; text-align: center">{{announcement}} <a href="Campaign.dc.html" style="color: #FF8A47; font-weight: 600">Shop deals</a></p>
      <nav aria-label="Utility" style="display: flex; gap: 20px">
        <a href="Help.dc.html" style="color: #C4C5C8; text-decoration: none">Track order</a>
        <a href="Help.dc.html" style="color: #C4C5C8; text-decoration: none">Help</a>
        <a href="About.dc.html" style="color: #C4C5C8; text-decoration: none">Contact</a>
      </nav>
    </div>
  </div>

  <!-- Logo, search, actions -->
  <div style="max-width: 1360px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center">
    <a href="Main.dc.html" aria-label="DealTargets home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F2125; flex: none">
      <svg width="38" height="38" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="#1F2125"></circle><circle cx="18" cy="18" r="9.5" fill="none" stroke="#FF6B1A" stroke-width="3"></circle><circle cx="18" cy="18" r="3.5" fill="#FF6B1A"></circle><path d="M18 1v6 M18 29v6 M1 18h6 M29 18h6" stroke="#1F2125" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -0.02em">Deal<span style="color: #E8590C">Targets</span><span style="font-weight: 500; font-size: 15px; color: #5A5C61">.com</span></span>
    </a>
    <form role="search" style="flex: 1 1 380px; display: flex; min-width: 0; height: 48px; border: 1.5px solid #C9C9CC; border-radius: 10px; overflow: hidden; background: #FFFFFF">
      <label for="hdr-cat" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Category</label>
      <select id="hdr-cat" style="border: 0; border-right: 1px solid #DEDEE0; background: #F2F2F3; padding: 0 12px; font: 500 14px Inter, sans-serif; color: #1F2125">
        <option>All categories</option><option>Graphics Cards</option><option>Processors</option><option>Motherboards</option><option>Memory</option><option>Storage</option><option>Power Supplies</option><option>Cases</option><option>Cooling</option>
      </select>
      <label for="hdr-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search products</label>
      <input id="hdr-q" type="search" placeholder="Search by product, brand, model or part number" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font: 400 15px Inter, sans-serif; color: #1F2125; outline: none">
      <button type="submit" aria-label="Search" style="width: 52px; border: 0; background: #FF6B1A; color: #1F2125; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14a7 7 0 0 0 0 14 M21 21l-5-5"></path></svg></button>
    </form>
    <nav aria-label="Account" style="display: flex; align-items: center; gap: 4px; flex: none">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #1F2125; text-decoration: none; font-size: 14px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0 M12 13a5 5 0 1 0 0-10a5 5 0 0 0 0 10"></path></svg>Sign in</a>
      <a href="Main.dc.html" aria-label="Wishlist" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; color: #1F2125"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6l1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg></a>
      <a href="Product.dc.html" aria-label="Cart, 2 items" style="position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #1F2125; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 8H6 M9.5 21a1 1 0 1 0 0-2a1 1 0 0 0 0 2 M17.5 21a1 1 0 1 0 0-2a1 1 0 0 0 0 2"></path></svg>Cart<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #FF6B1A; color: #1F2125; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">2</span></a>
    </nav>
  </div>

  <!-- Main navigation -->
  <nav aria-label="Main" style="border-top: 1px solid #DEDEE0">
    <ul style="max-width: 1360px; margin: 0 auto; padding: 0 20px; list-style: none; display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; box-sizing: border-box">
      <li><a href="Collection.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px; color: #1F2125; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"></path></svg>Shop all</a></li>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <li><a href="Collection.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; color: #303236; text-decoration: none; font-size: 15px; font-weight: 500">{{n}}</a></li>
      </sc-for>
      <li><a href="Campaign.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; color: #C2410C; text-decoration: none; font-size: 15px; font-weight: 700">Deals</a></li>
      <li><a href="Help.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; color: #303236; text-decoration: none; font-size: 15px; font-weight: 500">Build help</a></li>
    </ul>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"announcement":{"editor":"text","default":"Free US shipping on orders over $[THRESHOLD] · Black Friday starts Nov 27."},"$preview":{"width":1440,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      announcement: this.props.announcement ?? 'Free US shipping on orders over $[THRESHOLD] · Black Friday starts Nov 27.',
      nav: ['Graphics Cards', 'Processors', 'Motherboards', 'Memory', 'Storage', 'Power Supplies', 'Cases', 'Cooling']
    };
  }
}
</script>
</body>
</html>
